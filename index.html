<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>De’Saints Security Academy Portal</title>
<style>
:root{--bg:#f3f5f9;--sf:#fff;--ink:#0b1f45;--mu:#55627a;--ln:#d5dbe6;--ac:#0b1f45;--ai:#fff;--gd:#f5b800;--ok:#17703d;--bad:#b3261e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a1226;--sf:#121c36;--ink:#e8edf8;--mu:#9aa8c4;--ln:#26345a;--ac:#f5b800;--ai:#0b1f45;--ok:#6fd49a;--bad:#ff8f86;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0a1226;--sf:#121c36;--ink:#e8edf8;--mu:#9aa8c4;--ln:#26345a;--ac:#f5b800;--ai:#0b1f45;--ok:#6fd49a;--bad:#ff8f86;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.w{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}h1,h2,h3{margin:0;line-height:1.2}h1{font-size:24px}h2{font-size:19px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:3px solid var(--gd);padding-bottom:10px}.mu{color:var(--mu);font-size:14px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
button,input,select{font:inherit;color:inherit}input,select{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--ln);border-radius:8px;background:var(--sf)}
button{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--ac);background:var(--ac);color:var(--ai);font-weight:600;cursor:pointer}button.g{background:transparent;color:var(--ink);border-color:var(--ln)}button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--gd);outline-offset:2px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
label.o{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--ln);border-radius:8px;cursor:pointer}label.o input{width:20px;min-height:20px;margin-top:2px}label.o span,.pl{white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.err{color:var(--bad);font-size:14px;min-height:20px}.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}.tabs{display:flex;gap:8px}.tabs button{flex:1}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}.sc{overflow-x:auto}

const css=`
:root{--bga:.1;--r:18px;--sh:0 1px 2px rgba(11,31,69,.06),0 10px 28px rgba(11,31,69,.07)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bga:.2;--sh:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35)}}
:root[data-theme=dark]{--bga:.2;--sh:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35)}
#bgart{position:fixed;inset:0;z-index:-1;pointer-events:none;background:url(${IMG}) center/cover no-repeat;opacity:var(--bga)}
body{font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5}
.card{border-radius:var(--r);box-shadow:var(--sh);border-color:transparent;padding:18px;gap:10px}
:root[data-theme=dark] .card,:root:not([data-theme=light]) .card{border-color:var(--ln)}
button{border-radius:12px;transition:transform .12s,filter .12s}button:active{transform:scale(.98)}button:not(:disabled):hover{filter:brightness(1.08)}
input,select,textarea{border-radius:12px}
.brand{position:sticky;top:8px;z-index:20;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);background:rgba(8,20,44,.9);border:1px solid rgba(255,255,255,.08);border-bottom:2px solid var(--gd);border-radius:16px;padding:12px 18px}
.brand img{width:40px;height:40px}.brand b{font-size:17px}
.top{position:relative;overflow:hidden;border:0;border-radius:22px;padding:28px 28px;color:#fff;background:linear-gradient(105deg,rgba(6,20,48,.95),rgba(8,52,66,.8)),url(${IMG}) center/cover;box-shadow:var(--sh)}
.top::after{content:'';position:absolute;inset:0;background:url("${PAT}");pointer-events:none}
.top>*{position:relative;z-index:1}.top h1{color:#fff;font-size:clamp(26px,3.4vw,40px);letter-spacing:-.01em}.top .mu{color:#b9d8d1;font-size:15px}
.top button{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3);box-shadow:none}
.hero2{position:relative;overflow:hidden;color:#fff;border-radius:24px;padding:clamp(28px,6vw,72px) clamp(22px,5vw,64px);gap:16px;background:linear-gradient(105deg,rgba(6,20,48,.95),rgba(8,60,70,.78)),url(${IMG}) center/cover;box-shadow:var(--sh)}
.hero2::after{content:'';position:absolute;inset:0;background:url("${PAT}");pointer-events:none}.hero2>*{position:relative;z-index:1}
.hero2 h1{font-size:clamp(28px,4.6vw,56px);max-width:18em;letter-spacing:-.02em;line-height:1.08}.hero2 .mu{color:#c3dfd8;font-size:clamp(15px,1.6vw,19px);max-width:42em}
.hero2 button{background:var(--gd);color:#0b1f45;border-color:var(--gd);box-shadow:none;min-height:50px;padding:0 24px;font-size:16px}.hero2 button.g{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.35)}
.card:has(>.ring){flex-direction:row;flex-wrap:wrap;justify-content:space-around;align-items:flex-start}.ring{flex:1;min-width:96px}
.pc .price{font-size:32px}.grid>.card:not(.pc):hover,.pc:hover{transform:translateY(-3px);transition:transform .15s}
@media (min-width:900px){body{padding:20px clamp(24px,4vw,72px) 60px}.w{max-width:1680px;gap:20px}.grid{grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
 .w>details,.w>h2{max-width:980px}.top{padding:36px 40px}}
@media (min-width:1500px){.grid{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}}
@media (max-width:600px){body{font-size:17px;padding-top:10px}.w{gap:16px}.mu{font-size:15px}
 .grid{grid-template-columns:1fr 1fr;gap:12px}.grid>.card:not(.pc){padding:16px 14px;gap:8px}.grid>.card:not(.pc) .mu{display:none}.grid>.card:not(.pc) h2{font-size:18px;border-left:0;padding-left:0}
 .grid>.card:not(.pc) h2{display:flex;flex-direction:column;align-items:flex-start;gap:8px;font-size:17px}.grid>.card:not(.pc) .bd{margin:0}.grid>.card:not(.pc) button{min-height:46px}.top{flex-direction:column;align-items:flex-start}.top button{white-space:nowrap}.top{padding:22px 20px;border-radius:20px}.top h1{font-size:26px}
 .hero2{padding:30px 20px;border-radius:22px}.hero2 .mu{display:none}.hero2 h1{font-size:28px}
 .grid:has(.pc){grid-template-columns:1fr}.pc .ul,.pc .mu:not(:first-of-type){display:none}.pc{padding:20px}
 .w>details p{font-size:16px}.card:has(>.ring){gap:6px}.ring{min-width:80px;font-size:13px}
 #cb{right:14px}}

const chTO=(p,ms)=>Promise.race([p,new Promise((_,rj)=>setTimeout(()=>rj(new Error('__timeout')),ms))]);
function chErrMsg(x){const m=String((x&&x.message)||x||'');if(m==='__timeout'||/fetch|network|failed|load/i.test(m))return'The connection is weak, so this did not send.';if(/mime|type/i.test(m))return'This type of file is not allowed.';if(/size|large|exceed/i.test(m))return'The file is too big. 10 MB is the most.';return m||'Could not send. Please try again.'}
async function chUploadSend(blob,mime,ext,tpl){const er=document.getElementById('cher'),room=CH.cur&&CH.cur.room;if(!room)return;
 const bm=String(mime||'').split(';')[0]||'application/octet-stream';CH.pend={blob,mime,ext,tpl};
 if(er)er.textContent='Sending...';const path=`${chRK(room)}/${me.id}/${chId()}.${ext}`;let up=false;
 try{const u=await chTO(sb.storage.from('chatfiles').upload(path,blob,{contentType:bm,cacheControl:'3600'}),60000);if(u.error)throw u.error;up=true;
  const r=await chTO(sb.rpc('chat_send',{p_room:room,p_body:tpl.replace('%P%',path)}),25000);if(r.error)throw r.error;
  CH.pend=null;const e2=document.getElementById('cher');if(e2)e2.textContent='';await chNew();const m=document.getElementById('cpm');if(m)m.scrollTop=m.scrollHeight}
 catch(x){if(up){try{sb.storage.from('chatfiles').remove([path])}catch(e){}}
  const e2=document.getElementById('cher');if(e2)e2.innerHTML=esc(chErrMsg(x))+' <button type="button" class="g" data-m="chretry" style="min-height:32px;padding:0 12px">Try again</button>'}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-m=chretry]');if(!b)return;const p=CH.pend;if(p)chUploadSend(p.blob,p.mime,p.ext,p.tpl)});
