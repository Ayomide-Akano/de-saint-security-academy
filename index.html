<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>De’Saints Security Academy Portal</title>
<style>
:root{--bg:#f3f5f9;--sf:#fff;--ink:#0b1f45;--mu:#55627a;--ln:#d5dbe6;--ac:#0b1f45;--ai:#fff;--gd:#f5b800;--ok:#17703d;--bad:#b3261e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a1226;--sf:#121c36;--ink:#e8edf8;--mu:#9aa8c4;--ln:#26345a;--ac:#f5b800;--ai:#0b1f45;--ok:#6fd49a;--bad:#ff8f86;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0a1226;--sf:#121c36;--ink:#e8edf8;--mu:#9aa8c4;--ln:#26345a;--ac:#f5b800;--ai:#0b1f45;--ok:#6fd49a;--bad:#ff8f86;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.w{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}h1,h2,h3{margin:0;line-height:1.2}h1{font-size:24px}h2{font-size:19px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:3px solid var(--gd);padding-bottom:10px}.mu{color:var(--mu);font-size:14px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
button,input,select{font:inherit;color:inherit}input,select{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--ln);border-radius:8px;background:var(--sf)}
button{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--ac);background:var(--ac);color:var(--ai);font-weight:600;cursor:pointer}button.g{background:transparent;color:var(--ink);border-color:var(--ln)}button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--gd);outline-offset:2px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
label.o{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--ln);border-radius:8px;cursor:pointer}label.o input{width:20px;min-height:20px;margin-top:2px}label.o span,.pl{white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.err{color:var(--bad);font-size:14px;min-height:20px}.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}.tabs{display:flex;gap:8px}.tabs button{flex:1}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}.sc{overflow-x:auto}

 A.innerHTML=shopHd()+`<div><button class="g" data-s="shop">← Back to courses</button></div><div class="card"><h2>${esc(p.title)}</h2><div class="price" style="font-size:26px;font-weight:800">${N(price)}</div><div class="mu">Your price is locked when your first payment is confirmed. Seats are held for 15 minutes once you press Pay.</div></div>
 <div class="card"><h3>Your details</h3><input id="nm" placeholder="Full name (as it should appear on your certificate)" autocomplete="name"><input id="em" type="email" placeholder="Email (your account will use this email)" autocomplete="email"><input id="ph" type="tel" placeholder="Phone number (WhatsApp if possible)" autocomplete="tel"><input id="rf" placeholder="Referral code (optional)" autocapitalize="characters"></div>
 <div class="card"><h3>Payment plan</h3><select id="cpl">${p.plans.map(n=>`<option value="${n}" ${n===plan?'selected':''}>${planLabel(n)}</option>`).join('')}</select><div id="sc"></div></div>
 <div class="card"><label class="o"><input type="checkbox" id="ag" style="width:auto;min-height:0"><span>I agree to the Terms and the Refund policy: full refund less the Paystack fee before the cohort starts, none after.</span></label><div class="err" id="er">${esc(msg||'')}</div><button data-s="pay" id="pb">Pay now</button><div class="mu">Secure payment by Paystack: card, bank, bank transfer or USSD. We never see your card details.</div></div>`;
 drawSched()}
function drawSched(){const e=document.getElementById('sc');if(!e||!CK)return;const n=+document.getElementById('cpl').value,s=sched(CK.pid,n,CK.total,CK.first);e.innerHTML=`<table>${s.map(x=>`<tr><td>${x.n===1?'Today':'Instalment '+x.n}</td><td>${x.n===1?'at checkout':'due '+DT(x.due)}</td><td style="text-align:right"><b>${N(x.a)}</b></td></tr>`).join('')}</table>`+(n>1?'<div class="mu">You pay each later instalment yourself from your portal. Nothing is charged automatically.</div>':'')}
document.addEventListener('change',e=>{if(e.target.id==='cpl')drawSched()});

async function openPay(r,extra,onOk,onCancel){
 await loadPaystack();
 new PaystackPop().newTransaction({key:r.public_key,email:r.email,amount:r.amount_kobo,currency:'NGN',reference:r.reference,channels:['card','bank','bank_transfer','ussd'],
  metadata:{product:extra.product||null,plan:extra.plan||null,instalment:extra.n||1,referral:extra.referral||null},
  onSuccess:()=>onOk(),onCancel:()=>onCancel&&onCancel(),onError:e=>onCancel&&onCancel(e?.message||'The payment window could not open.')})}

async function payNow(){
 const v=i=>document.getElementById(i).value.trim(),er=document.getElementById('er'),b=document.getElementById('pb');
 if(!document.getElementById('ag').checked)return er.textContent='Tick the box to agree to the Terms and Refund policy.';
 if(v('nm').length<3)return er.textContent='Enter your full name.';
 if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v('em')))return er.textContent='Enter a valid email address.';
 const body={action:'init',product:CK.pid,plan:+v('cpl'),name:v('nm'),email:v('em'),phone:v('ph'),referral:v('rf')};
 b.disabled=true;b.textContent='Please wait...';er.textContent='';
 const r=await shopCall(body);
 if(r.error){er.textContent=r.error;b.disabled=false;b.textContent='Pay now';return}
 if(r.total!==CK.total){CK.total=r.total;drawSched();document.querySelector('.price').textContent=N(r.total);er.textContent=`The price is now ${N(r.total)} because founder seats were taken while you filled this in. Press Pay now again to continue.`;b.disabled=false;b.textContent='Pay now';return}
 LS.set('dsa_pay',JSON.stringify({ref:r.reference,email:r.email,name:r.name}));
 try{await openPay(r,{product:body.product,plan:body.plan,referral:body.referral,n:1},()=>afterPay(r.reference),m=>{er.textContent=m||'Payment cancelled. Your seat is held for 15 minutes if you want to try again.';b.disabled=false;b.textContent='Pay now'})}
 catch(e){er.textContent=e.message;b.disabled=false;b.textContent='Pay now'}}

async function confirmPay(ref,title){
 A.innerHTML=(me?hd(title||'Payment'):shopHd())+`<div class="card"><h2>Confirming your payment</h2><p class="mu" id="cm">Please keep this page open. Bank transfers can take a minute or two.</p></div>`;
 for(let i=0;i<45;i++){const v=await shopCall({action:'verify',reference:ref});if(v.state==='success')return v;if(v.state==='failed'||v.state==='problem'||v.error)return v;await sleep(4000)}
 return{state:'pending'}}
async function afterPay(ref){
 const v=await confirmPay(ref);
 if(v.state==='success'){if(v.claimed){LS.del('dsa_pay');mode='in';return authV('Payment received. You already have an account with this email. Log in and your course will be added.')}return claimV(ref,v.email,v.name)}
 A.innerHTML=shopHd()+`<div class="card"><h2>We have not seen the payment confirmed yet</h2><p>${v.state==='failed'?'The payment did not go through. You have not been charged.':'If your bank has already debited you, do not pay again. It can take a few minutes. Keep this reference:'}</p><p><b>${esc(ref)}</b></p><button data-s="finish">Check again</button><a href="https://wa.me/${WA}?text=${encodeURIComponent('Hello, my payment reference is '+ref)}" target="_blank" rel="noopener"><button type="button" class="g">Message us on WhatsApp</button></a><button class="g" data-s="shop">Back to courses</button></div>`}

function claimV(ref,email,name,msg){
 CK={...(CK||{}),ref,email,name};
 A.innerHTML=shopHd()+`<div class="card"><h2>✅ Payment received</h2><p>Create your account to start. Your email is locked to the one that paid.</p></div><div class="card"><h3>Create your account</h3><input value="${esc(name)}" readonly aria-label="Name"><input value="${esc(email)}" readonly aria-label="Email"><input id="p1" type="password" placeholder="Choose a password (8+ characters)" autocomplete="new-password"><input id="p2" type="password" placeholder="Type the password again" autocomplete="new-password"><div class="err" id="er">${esc(msg||'')}</div><button data-s="claim">Create account</button></div>`}
async function claimGo(){
 const p1=document.getElementById('p1').value,p2=document.getElementById('p2').value,er=document.getElementById('er'),b=document.querySelector('[data-s=claim]');
 if(p1.length<8)return er.textContent='Use a password of at least 8 characters.';if(p1!==p2)return er.textContent='The two passwords do not match.';
 b.disabled=true;er.textContent='';
 const r=await shopCall({action:'claim',reference:CK.ref,email:CK.email,password:p1});
 if(r.error){er.textContent=r.error;b.disabled=false;return}
 if(r.state==='exists'||r.state==='already'){LS.del('dsa_pay');mode='in';return authV('You already have an account with this email. Log in and your new course will be added.')}
 const{error}=await sb.auth.signInWithPassword({email:CK.email,password:p1});
 LS.del('dsa_pay');if(error){mode='in';return authV('Account created. Log in with your email and password.')}
 boot()}

function finishV(msg){
 let s={};try{s=JSON.parse(LS.get('dsa_pay')||'{}')}catch(e){}
 A.innerHTML=shopHd()+`<div><button class="g" data-s="shop">← Back to courses</button></div><div class="card"><h2>Finish setting up your account</h2><p class="mu">Enter the payment reference from your receipt (it starts with DSA) and the email you paid with.</p><input id="fr" placeholder="Payment reference" value="${esc(s.ref||'')}" autocapitalize="characters"><input id="fe" type="email" placeholder="Email you paid with" value="${esc(s.email||'')}"><div class="err" id="er">${esc(msg||'')}</div><button data-s="fgo">Continue</button></div>`}
async function finishGo(){
 const ref=document.getElementById('fr').value.trim(),em=document.getElementById('fe').value.trim(),er=document.getElementById('er');
 if(!ref||!em)return er.textContent='Enter both the reference and your email.';er.textContent='Checking...';
 const v=await shopCall({action:'verify',reference:ref});
 if(v.error)return er.textContent=v.error;
 if(v.state!=='success')return er.textContent=v.state==='failed'?'That payment did not go through.':'We have not seen this payment confirmed yet. Try again in a few minutes.';
 if(v.email.toLowerCase()!==em.toLowerCase())return er.textContent='That email does not match the one used to pay.';
 if(v.claimed){mode='in';return authV('Your account already exists. Log in with your email and password.')}
 claimV(ref,v.email,v.name)}

/* Pay next instalment (inside the student portal) */
async function addPay(){
 if(!me||me.role==='instructor')return;
 const{data:os}=await sb.from('orders').select('id,product_id,total,status,instalments(n,amount,due,paid_at)').in('status',['partial','paid']).order('created_at');
 if(!os||!os.length)return;const card=[...A.querySelectorAll('.card')].find(c=>c.querySelector('h3')?.textContent==='Payments');if(!card)return;
 const today=new Date().toISOString().slice(0,10);let h='<div style="border-top:1px solid var(--ln);padding-top:10px"><b>Your online payments</b></div>',nx=null;
 os.forEach(o=>{const is=[...o.instalments].sort((a,b)=>a.n-b.n);h+=`<div class="mu">${esc(PT[o.product_id]||o.product_id)} · ${N(o.total)}</div><table>${is.map(i=>{const late=!i.paid_at&&i.due<today;if(!i.paid_at&&!nx&&o.status==='partial')nx={o:o.id,i};return `<tr><td>Instalment ${i.n}</td><td>${N(i.amount)}</td><td>${i.paid_at?'<span class="ok">Paid</span>':late?`<span class="bad">Overdue since ${DT(i.due)}</span>`:'Due '+DT(i.due)}</td></tr>`}).join('')}</table>`});
 if(nx)h+=`<button data-s="paynext" data-o="${nx.o}">Pay next instalment · ${N(nx.i.amount)}</button><div class="err" id="pe"></div>`;
 card.insertAdjacentHTML('beforeend',h)}
async function payNext(o){
 const e=document.getElementById('pe'),b=document.querySelector('[data-s=paynext]');if(b)b.disabled=true;
 const r=await shopCall({action:'next',order:o});if(r.error){if(e)e.textContent=r.error;if(b)b.disabled=false;return}
 try{await openPay(r,{n:r.n},async()=>{const v=await confirmPay(r.reference,'Payment');if(v.state==='success'){me_()}else{A.innerHTML=hd('Payment')+back('me')+`<div class="card"><h2>Not confirmed yet</h2><p>If your bank debited you, do not pay again. Open My profile in a few minutes. Reference: <b>${esc(r.reference)}</b></p></div>`}},m=>{if(e)e.textContent=m||'Payment cancelled.';if(b)b.disabled=false})}
 catch(x){if(e)e.textContent=x.message;if(b)b.disabled=false}}

/* Instructor: orders, payments needing attention, referral codes */
async function ordV(){
 const[{data:os},{data:rc},{data:bad}]=await Promise.all([sb.from('orders').select('*,instalments(n,amount,paid_at),referrals(code,known,status,reward)').order('created_at',{ascending:false}).limit(100),sb.from('referral_codes').select('*').order('created_at'),sb.from('payments').select('ref,amount_kobo,created_at,orders(email)').eq('status','mismatch')]);
 const row=o=>{const is=o.instalments||[],pd=is.filter(i=>i.paid_at).length,rf=[].concat(o.referrals||[])[0];return `<tr><td>${esc(o.full_name)}<div class="mu">${esc(o.email)}</div></td><td>${esc(PT[o.product_id]||o.product_id)}<div class="mu">${planLabel(o.plan)}</div></td><td>${N(o.total)}<div class="mu">${pd} of ${is.length} paid</div></td><td>${esc(o.status)}${o.user_id?'':'<div class="mu">no account yet</div>'}${rf?`<div class="${rf.known?'mu':'bad'}">${rf.known?'Referral':'Unknown referral'}: ${esc(rf.code)}</div>`:''}</td></tr>`};
 A.innerHTML=hd('Orders and payments')+back()+((bad||[]).length?`<div class="card"><h3 class="bad">Payments that need attention</h3>${bad.map(p=>`<div>${esc(p.ref)} · ${N(p.amount_kobo/100)} · ${esc(p.orders?.email||'')}</div>`).join('')}<div class="mu">The amount Paystack reported did not match the order. Check it in your Paystack dashboard.</div></div>`:'')
 +`<div class="card"><h3>Orders</h3><div class="sc">${(os||[]).length?`<table>${os.map(row).join('')}</table>`:'<span class="mu">No orders yet.</span>'}</div></div>`
 +`<div class="card"><h3>Referral codes</h3>${(rc||[]).length?`<table>${rc.map(r=>`<tr><td><b>${esc(r.code)}</b></td><td>${esc(r.owner_name)}</td><td>${esc(r.owner_phone||'')}</td></tr>`).join('')}</table>`:'<span class="mu">No codes yet.</span>'}<input id="rc1" placeholder="Code (letters and numbers, for example ADA10)" autocapitalize="characters"><input id="rc2" placeholder="Owner name"><input id="rc3" placeholder="Owner phone"><div class="err" id="er"></div><button data-s="rcadd">Add code</button></div>`}
async function rcAdd(){const v=i=>document.getElementById(i).value.trim(),code=v('rc1').toUpperCase().replace(/\s/g,'').slice(0,24),er=document.getElementById('er');if(!code||!v('rc2'))return er.textContent='Enter a code and the owner name.';const{error}=await sb.from('referral_codes').insert({code,owner_name:v('rc2'),owner_phone:v('rc3')});if(error)return er.textContent=error.message;ordV()}

document.addEventListener('click',async e=>{const b=e.target.closest('[data-s]');if(!b)return;const a=b.dataset.s,d=b.dataset;
 if(a==='shop')shopV();else if(a==='login'){mode='in';authV()}
 else if(a==='buy')checkoutV(d.p,+(document.getElementById('pl-'+d.p)?.value||1));
 else if(a==='pay')payNow();else if(a==='claim')claimGo();else if(a==='finish')finishV();else if(a==='fgo')finishGo();
 else if(a==='paynext')payNext(d.o);else if(a==='orders')ordV();else if(a==='rcadd')rcAdd();
 else if(a==='scroll')document.getElementById(d.t)?.scrollIntoView({behavior:'smooth'})});

window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.IP=e;document.querySelectorAll('.inst').forEach(b=>b.hidden=false)});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const d=b.dataset,a=d.a;
 if(a==='m-in'||a==='m-up'){mode=a.slice(2);authV()}else if(a==='go')go();else if(a==='out'){await sb.auth.signOut();me=null;mode='in';shopV()}
 else if(a==='home')home();else if(a==='list')list(d.k);else if(a==='take')take(d.id);else if(a==='sub')sub(d.id,d.k);else if(a==='ctl')ctl();else if(a==='stu')stu();else if(a==='pv')take(d.id,true);
 else if(a==='labs')labs();else if(a==='lab')lab(d.id);else if(a==='lpv')lab(d.id,true);else if(a==='tick')save(false);else if(a==='lsub'){if(confirm('Submit this lab for review? You cannot edit it until your instructor replies.'))save(true)}else if(a==='rm'){rmf(+d.i)}else if(a==='rvq')rvq();else if(a==='sprof')prof(d.id);else if(a==='att'){await sb.from('attendance').upsert({user_id:d.u,session:+d.s,present:d.p!=='true'});prof(d.u,'pe')}else if(a==='rev'){const c=prompt(d.v==='pass'?'Comment (optional)':'What must be redone?')??null;if(c===null)return;await sb.from('lab_progress').update({status:d.v,comment:c}).eq('user_id',d.u).eq('lab_id',d.l);rvq()}
 else if(a==='me')me_();else if(a==='inst'){window.IP?.prompt()}else if(a==='forgot'){const em=document.getElementById('em')?.value.trim();if(!em)return authV('Type your email above, then tap Forgot password.');const{error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});authV(error?error.message:'If that email has an account, a reset link is on its way. Check your inbox and spam folder.')}
else if(a==='setpw'){const p=document.getElementById('np').value;if(p.length<8)return recV('Use at least 8 characters.');const{error}=await sb.auth.updateUser({password:p});if(error)return recV(error.message);window.REC=false;history.replaceState(null,'',location.pathname);boot()}
else if(a==='chk')boot();else if(a==='dl'){const{data:f}=await sb.from('lab_files').select('content').eq('lab_id',d.l).eq('name',d.n).single();if(f){const u=URL.createObjectURL(new Blob([f.content],{type:'text/plain;charset=utf-8'})),k=document.createElement('a');k.href=u;k.download=d.n;document.body.appendChild(k);k.click();k.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}}else if(a==='appr'){const{error}=await sb.from('profiles').update({approved:d.v==='1'}).eq('id',d.id);if(error)alert(error.message);stu()}else if(a==='vfy')vfyV();else if(a==='vgo'){const{data,error}=await sb.rpc('verify_certificate',{p_no:v1('vn'),p_name:v1('vm')});if(error)return document.getElementById('vr').innerHTML='<p class="bad">'+esc(error.message)+'</p>';document.getElementById('vr').innerHTML=data?`<p class="ok">Valid certificate.</p><div>${esc(data.name)} completed the ${esc(CN[data.cohort])}.<br>Cohort dates: ${esc(data.dates)}<br>Certificate ID: ${esc(data.no)}</div>`:'<p class="bad">No certificate matches that ID and name. Check the spelling.</p>'}
else if(a==='fb')fb(d.id);else if(a==='plsave'){const{error}=await sb.rpc('set_portfolio',{p_url:v1('pl')});if(error)return alert(error.message);me.portfolio_url=v1('pl');me_()}else if(a==='ex')ex(d.t);else if(a==='crt')crt();else if(a==='cv')certV(d.id);else if(a==='cap'){await sb.from('cert_flags').upsert({user_id:d.u,capstone:d.v!=='true'});crt()}else if(a==='iss'){const dt=prompt('Cohort dates to print on the certificate, for example 19 Oct to 14 Dec 2026',window.LD||'');if(!dt)return;window.LD=dt;const{error}=await sb.rpc('issue_certificate',{p_user:d.u,p_dates:dt});if(error)alert(error.message);crt()}else if(a==='rtx'){if(confirm('Delete this student\'s exam attempt so they can retake the final?')){const ids=d.ids.split(',');await sb.from('attempts').delete().eq('user_id',d.u).in('assessment_id',ids);await sb.from('wans').delete().eq('user_id',d.u).in('assessment_id',ids);crt()}}else if(a==='dl'){const l=document.createElement('a');l.href=CV.url;l.download=CV.no+'.png';l.click()}else if(a==='pr'){const w=open('');w.document.write('<img src="'+CV.url+'" style="width:100%"><style>@page{size:A4 landscape;margin:0}</style>');w.document.close();setTimeout(()=>w.print(),400)}else if(a==='wrq')wrq();else if(a==='mk'){const m=prompt('Marks out of '+d.m);if(m===null)return;const c=prompt('Comment for the student (optional)')||'';await sb.rpc('mark_written',{p_user:d.u,p_assessment:d.as,p_pos:+d.p,p_marks:Math.round(+m)||0,p_comment:c});wrq()}else if(a==='psave'){await sb.rpc('update_my_profile',{p_phone:v1('ph'),p_city:v1('ct'),p_photo:null});me.phone=v1('ph');me.city=v1('ct');me_()}else if(a==='ptab')prof(d.id,d.t)
 else if(a==='fsave'){const{error}=await sb.from('finance').upsert({user_id:d.id,total_fee:+v1('f1')||0,paid:+v1('f2')||0,installments:+v1('f3')||1,installments_paid:+v1('f4')||0,next_due:v1('f5')||null,note:v1('f6')||null});if(error)return alert(error.message);prof(d.id,'fi')}
 else if(a==='nsave'){await sb.from('profiles').update({full_name:v1('n1'),phone:v1('ph'),city:v1('ct')}).eq('id',d.id);prof(d.id,'pe')}
 else if(a==='tg'){await sb.from(d.t||'assessments').update({is_open:d.o!=='true'}).eq('id',d.id);ctl()}
 else if(a==='rt'&&confirm('Delete this exam attempt so the student can retake it?')){await sb.from('attempts').delete().eq('id',d.id);await sb.from('wans').delete().eq('user_id',d.u).eq('assessment_id',d.as);prof(d.u)}});
window.addEventListener('error',e=>{A.innerHTML='<div class="card"><b>Something went wrong</b><div class="err">'+esc(e.message)+'</div></div>'});
sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){window.REC=true;recV()}});
boot().catch(e=>{A.innerHTML='<div class="card"><b>Could not start</b><div class="err">'+esc(e.message)+'</div></div>'});
</script></body></html>
