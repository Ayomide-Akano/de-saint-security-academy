<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>De’Saints Security Academy Portal</title>
<style>
:root{--bg:#f3f5f9;--sf:#fff;--ink:#0b1f45;--mu:#55627a;--ln:#d5dbe6;--ac:#0b1f45;--ai:#fff;--gd:#f5b800;--ok:#17703d;--bad:#b3261e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a1226;--sf:#121c36;--ink:#e8edf8;--mu:#9aa8c4;--ln:#26345a;--ac:#f5b800;--ai:#0b1f45;--ok:#6fd49a;--bad:#ff8f86;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0a1226;--sf:#121c36;--ink:#e8edf8;--mu:#9aa8c4;--ln:#26345a;--ac:#f5b800;--ai:#0b1f45;--ok:#6fd49a;--bad:#ff8f86;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.w{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}h1,h2,h3{margin:0;line-height:1.2}h1{font-size:24px}h2{font-size:19px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:3px solid var(--gd);padding-bottom:10px}.mu{color:var(--mu);font-size:14px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
button,input,select{font:inherit;color:inherit}input,select{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--ln);border-radius:8px;background:var(--sf)}
button{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--ac);background:var(--ac);color:var(--ai);font-weight:600;cursor:pointer}button.g{background:transparent;color:var(--ink);border-color:var(--ln)}button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--gd);outline-offset:2px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
label.o{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--ln);border-radius:8px;cursor:pointer}label.o input{width:20px;min-height:20px;margin-top:2px}
.err{color:var(--bad);font-size:14px;min-height:20px}.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}.tabs{display:flex;gap:8px}.tabs button{flex:1}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}.sc{overflow-x:auto}

<input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Password (8+ characters)" autocomplete="${mode==='in'?'current-password':'new-password'}">
<div class="err" id="er">${esc(msg)}</div><button data-a="go">${mode==='in'?'Log in':'Create account'}</button></div>`}
async function go(){const v=i=>document.getElementById(i)?.value.trim(),em=v('em'),pw=document.getElementById('pw').value;
 if(!em||pw.length<8)return authV('Enter your email and a password of at least 8 characters.');
 if(mode==='up'){if(!v('nm'))return authV('Enter your full name.');
  const{data,error}=await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.origin+location.pathname,data:{full_name:v('nm'),cohort:v('co')}}});
  if(error)return authV(error.message);if(!data.session){mode='in';return authV('Account created. Check your email to confirm it, then log in.')}}
 else{const{error}=await sb.auth.signInWithPassword({email:em,password:pw});if(error)return authV(error.message)}
 boot()}
function home(){document.body.classList.remove('au');if(me.role==='instructor')return A.innerHTML=hd('Instructor home')+`<div class="grid">
<div class="card"><h2>Quizzes and exams</h2><p class="mu">Switch each one on when you have taught the topic. Preview what students see.</p><button data-a="ctl">Open</button></div>
<div class="card"><h2>Lab reviews</h2><p class="mu">Check screenshots and mark Pass or Redo.</p><button data-a="rvq">Open</button></div>
<div class="card"><h2>Students</h2><p class="mu">Profile, attendance, scores, labs and retakes.</p><button data-a="stu">Open</button></div>
<div class="card"><h2>Assignments · Certificates</h2><p class="mu">Coming in the next part.</p><button disabled>Soon</button></div></div></div>`;
 A.innerHTML=hd('Welcome, '+esc(me.full_name.split(' ')[0]))+`<div class="grid">
<div class="card"><h2>Quizzes</h2><p class="mu">Weekly quizzes.</p><button data-a="list" data-k="quiz">Open</button></div>
<div class="card"><h2>Exams</h2><p class="mu">Final assessment. One attempt unless your instructor allows a retake.</p><button data-a="list" data-k="exam">Open</button></div>
<div class="card"><h2>Assignments</h2><p class="mu">Coming soon.</p><button disabled>Soon</button></div>
<div class="card"><h2>Labs</h2><p class="mu">Tick each step, upload screenshots, submit for review.</p><button data-a="labs">Open</button></div></div>`}
async function list(k){const[{data:as},{data:at}]=await Promise.all([sb.from('assessments').select('*').eq('kind',k).order('week'),sb.from('attempts').select('*').eq('user_id',(await sb.auth.getUser()).data.user.id)]);
 A.innerHTML=hd(k==='quiz'?'Quizzes':'Exams')+back()+(as.length?as.map(a=>{const m=at.filter(x=>x.assessment_id===a.id),b=m.sort((x,y)=>y.score-x.score)[0],done=k==='exam'&&m.length;
 return `<div class="card row"><div><h3>${esc(a.title)}</h3><div class="mu">${b?`Best: ${b.score}/${b.total} · <span class="${b.passed?'ok':'bad'}">${b.passed?'Passed':'Not passed'}</span>`:'Not taken yet'}</div></div>
 <button data-a="take" data-id="${a.id}" ${done?'disabled':''}>${done?'Taken':b?'Retake':'Start'}</button></div>`}).join(''):'<div class="card mu">Nothing is open yet. Your instructor will open each one after the class.</div>')}
async function take(id,pv){const[{data:a},{data:q}]=await Promise.all([sb.from('assessments').select('*').eq('id',id).single(),sb.from('questions').select('*').eq('assessment_id',id).order('pos')]);
 A.innerHTML=hd(esc(a.title))+back(pv?'ctl':'list')+(pv?'<div class="card mu">Preview: this is what students see. Submitting is switched off.</div>':'')+
 `<form id="f" class="w">${q.map(x=>`<div class="card"><h3>${x.pos}. ${esc(x.q)}</h3>${x.opts.map((o,i)=>`<label class="o"><input type="radio" name="q${x.pos}" value="${i}"><span>${'ABCD'[i]}. ${esc(o)}</span></label>`).join('')}</div>`).join('')}
 <div class="err" id="er"></div><button type="button" data-a="sub" data-id="${id}" data-k="${a.kind}" ${pv?'disabled':''}>Submit answers</button></form>`}
async function sub(id,k){const f=new FormData(document.getElementById('f')),ans={};f.forEach((v,n)=>ans[n.slice(1)]=+v);
 const n=document.querySelectorAll('#f .card').length;if(Object.keys(ans).length<n&&!confirm(`You have answered ${Object.keys(ans).length} of ${n}. Submit anyway?`))return;
 const{data,error}=await sb.rpc('submit_attempt',{p_assessment:id,p_answers:ans});if(error)return document.getElementById('er').textContent=error.message;
 A.innerHTML=hd('Result')+`<div class="card"><h2>${data.score} out of ${data.total}</h2><p class="${data.passed?'ok':'bad'}">${data.passed?'Passed. Well done.':k==='exam'?'Not passed yet. Review the weeks you missed, then ask your instructor about a retake.':'Not passed yet. Re-read the notes and retake after 24 hours.'}</p><button data-a="list" data-k="${k}">Back to ${k==='quiz'?'quizzes':'exams'}</button></div>`}
async function ctl(){const{data:as}=await sb.from('assessments').select('*').order('cohort').order('week');
 A.innerHTML=hd('Quizzes and exams')+back()+['beginner','intermediate'].map(c=>`<div class="card"><h2>${CO[c]}</h2>${as.filter(a=>a.cohort===c).map(a=>`<div class="row"><div><b>${esc(a.title)}</b><div class="mu ${a.is_open?'ok':''}">${a.is_open?'Visible to students':'Hidden'}</div></div><div class="row"><button class="g" data-a="pv" data-id="${a.id}">Preview</button><button data-a="tg" data-id="${a.id}" data-o="${a.is_open}">${a.is_open?'Hide':'Activate'}</button></div></div>`).join('')}</div>`).join('')}
async function stu(){const[{data:p},{data:t},{data:as}]=await Promise.all([sb.from('profiles').select('*').eq('role','student').order('cohort').order('full_name'),sb.from('attempts').select('*').order('taken_at'),sb.from('assessments').select('id,title,kind')]);const T=Object.fromEntries(as.map(a=>[a.id,a]));
 A.innerHTML=hd('Students')+back()+(p.length?p.map(s=>{const m=t.filter(x=>x.user_id===s.id);return `<div class="card"><h3>${esc(s.full_name)} <span class="mu">· ${CO[s.cohort]}</span></h3><div class="sc">${m.length?`<table>${m.map(x=>`<tr><td>${esc(T[x.assessment_id]?.title)}</td><td>${x.score}/${x.total}</td><td class="${x.passed?'ok':'bad'}">${x.passed?'Pass':'Fail'}</td><td>${T[x.assessment_id]?.kind==='exam'?`<button class="g" data-a="rt" data-id="${x.id}" data-u="${s.id}">Allow retake</button>`:''}</td></tr>`).join('')}</table>`:'<span class="mu">No attempts yet.</span>'}</div></div>`}).join(''):'<div class="card mu">No students have signed up yet.</div>')}

const ST={draft:'In progress',submitted:'Waiting for review',pass:'Passed',redo:'Redo needed'},uid=async()=>(await sb.auth.getUser()).data.user.id;let LB=null;
async function labs(){const u=await uid(),[{data:ls},{data:ps}]=await Promise.all([sb.from('labs').select('id,title').order('week').order('id'),sb.from('lab_progress').select('lab_id,status').eq('user_id',u)]);
 A.innerHTML=hd('Labs')+back()+(ls.length?ls.map(l=>{const p=ps.find(x=>x.lab_id===l.id),s=p?.status||'draft';return `<div class="card row"><div><h3>${esc(l.title)}</h3><div class="mu ${s==='pass'?'ok':s==='redo'?'bad':''}">${p?ST[s]:'Not started'}</div></div><button data-a="lab" data-id="${l.id}">${p?'Open':'Start'}</button></div>`}).join(''):'<div class="card mu">No labs are open yet. Your instructor opens each one after the class.</div>')}
async function lab(id,pv){const u=await uid(),{data:l}=await sb.from('labs').select('*').eq('id',id).single(),{data:p}=pv?{data:null}:await sb.from('lab_progress').select('*').eq('user_id',u).eq('lab_id',id).maybeSingle();
 LB={id,u,pv,files:p?.files||[],st:p?.status||'draft'};const lock=pv||LB.st==='pass'||LB.st==='submitted',t=p?.ticks||[];
 A.innerHTML=hd(esc(l.title))+back(pv?'ctl':'labs')+(pv?'<div class="card mu">Preview: this is what students see. Saving is switched off.</div>':`<div class="card"><b class="${LB.st==='pass'?'ok':LB.st==='redo'?'bad':''}">${ST[LB.st]}</b>${p?.comment?`<div>Instructor: ${esc(p.comment)}</div>`:''}</div>`)+
 `<div class="card"><h3>Steps</h3>${l.steps.map((x,i)=>`<label class="o"><input type="checkbox" class="tk" data-a="tick" ${t[i]?'checked':''} ${lock?'disabled':''}><span>${i+1}. ${esc(x)}</span></label>`).join('')}<div class="mu">Full instructions are in your course pack.</div></div>
 <div class="card"><h3>Screenshots (proof of your work)</h3><div id="fl"></div>${lock?'':'<input type="file" id="fi" accept="image/*" multiple><div class="mu">Add a screenshot of each important result, for example a ping, a show command or your finished diagram.</div>'}<div class="err" id="er"></div></div>
 ${lock?'':'<button data-a="lsub">Submit for review</button>'}`;fl()}
function fl(){document.getElementById('fl').innerHTML=LB.files.length?LB.files.map((f,i)=>`<div class="row"><span>Screenshot ${i+1}</span>${LB.pv||['pass','submitted'].includes(LB.st)?'':`<button class="g" data-a="rm" data-i="${i}">Remove</button>`}</div>`).join(''):'<span class="mu">No screenshots yet.</span>'}
async function save(sub){if(LB.pv)return;const t=[...document.querySelectorAll('.tk')].map(c=>c.checked),{data,error}=await sb.rpc('save_lab',{p_lab:LB.id,p_ticks:t,p_files:LB.files,p_submit:sub}),e=document.getElementById('er');
 if(error){if(e)e.textContent=error.message;return}if(sub)return labs();if(e)e.textContent=''}
async function rmf(i){const p=LB.files.splice(i,1)[0];await sb.storage.from('lab-proofs').remove([p]);fl();save(false)}
const sq=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const s=Math.min(1,1400/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(r,'image/jpeg',.75)};i.src=URL.createObjectURL(f)});
document.addEventListener('change',async e=>{if(e.target.id!=='fi'||!LB)return;const er=document.getElementById('er');for(const f of e.target.files){if(LB.files.length>=8){er.textContent='Maximum 8 screenshots.';break}
 er.textContent='Uploading...';const b=await sq(f),p=`${LB.u}/${LB.id}/${Date.now()}.jpg`,{error}=await sb.storage.from('lab-proofs').upload(p,b,{contentType:'image/jpeg'});if(error){er.textContent=error.message;return}LB.files.push(p)}
 e.target.value='';er.textContent='';fl();save(false)});
async function rvq(){const{data:ps}=await sb.from('lab_progress').select('*').eq('status','submitted').order('updated_at');const[{data:pr},{data:ls}]=await Promise.all([sb.from('profiles').select('id,full_name'),sb.from('labs').select('id,title,steps')]);
 const cards=[];for(const p of ps){const s=pr.find(x=>x.id===p.user_id),l=ls.find(x=>x.id===p.lab_id),{data:u}=p.files.length?await sb.storage.from('lab-proofs').createSignedUrls(p.files,3600):{data:[]};
 cards.push(`<div class="card"><h3>${esc(s?.full_name)}</h3><div class="mu">${esc(l?.title)} · ${p.ticks.filter(Boolean).length}/${l?.steps.length} steps ticked</div><div class="row">${(u||[]).map(x=>`<a href="${x.signedUrl}" target="_blank"><img src="${x.signedUrl}" alt="Screenshot" style="width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--ln)"></a>`).join('')||'<span class="bad">No screenshots</span>'}</div>
 <div class="row"><button data-a="rev" data-v="pass" data-u="${p.user_id}" data-l="${p.lab_id}">Pass</button><button class="g" data-a="rev" data-v="redo" data-u="${p.user_id}" data-l="${p.lab_id}">Redo</button></div></div>`)}
 A.innerHTML=hd('Lab reviews')+back()+(cards.join('')||'<div class="card mu">Nothing is waiting for review.</div>')}
async function ctl(){const[{data:as},{data:ls}]=await Promise.all([sb.from('assessments').select('*').order('cohort').order('week'),sb.from('labs').select('*').order('cohort').order('week').order('id')]);
 const row=(t,a,pv)=>`<div class="row"><div><b>${esc(a.title)}</b><div class="mu ${a.is_open?'ok':''}">${a.is_open?'Visible to students':'Hidden'}</div></div><div class="row"><button class="g" data-a="${pv}" data-id="${a.id}">Preview</button><button data-a="tg" data-t="${t}" data-id="${a.id}" data-o="${a.is_open}">${a.is_open?'Hide':'Activate'}</button></div></div>`;
 A.innerHTML=hd('Activate content')+back()+['beginner','intermediate'].map(c=>`<div class="card"><h2>${CO[c]}: quizzes and exams</h2>${as.filter(a=>a.cohort===c).map(a=>row('assessments',a,'pv')).join('')}</div><div class="card"><h2>${CO[c]}: labs</h2>${ls.filter(a=>a.cohort===c).map(a=>row('labs',a,'lpv')).join('')}</div>`).join('')}
async function stu(){const{data:p}=await sb.from('profiles').select('*').eq('role','student').order('cohort').order('full_name');
 A.innerHTML=hd('Students')+back()+(p.length?p.map(s=>`<div class="card row"><div><h3>${esc(s.full_name)}</h3><div class="mu">${CO[s.cohort]}</div></div><button data-a="sprof" data-id="${s.id}">Profile</button></div>`).join(''):'<div class="card mu">No students have signed up yet.</div>')}
async function prof(id){const[{data:s},{data:t},{data:as},{data:ps},{data:at}]=await Promise.all([sb.from('profiles').select('*').eq('id',id).single(),sb.from('attempts').select('*').eq('user_id',id).order('taken_at'),sb.from('assessments').select('id,title,kind'),sb.from('lab_progress').select('lab_id,status').eq('user_id',id),sb.from('attendance').select('*').eq('user_id',id)]);
 const{data:L}=await sb.from('labs').select('id,title,week').eq('cohort',s.cohort).order('week').order('id'),T=Object.fromEntries(as.map(a=>[a.id,a])),pr=at.filter(x=>x.present).length;
 A.innerHTML=hd(esc(s.full_name))+back('stu')+`<div class="card"><h3>Attendance: ${pr} of 8 sessions</h3><div class="row">${[1,2,3,4,5,6,7,8].map(n=>{const on=at.find(x=>x.session===n)?.present;return `<button class="${on?'':'g'}" style="min-width:64px" data-a="att" data-u="${id}" data-s="${n}" data-p="${!!on}">${n}${on?' ✓':''}</button>`}).join('')}</div><div class="mu">Tap a session number to mark present. Tap again to undo. 6 of 8 needed.</div></div>
 <div class="card"><h3>Quizzes and exams</h3><div class="sc">${t.length?`<table>${t.map(x=>`<tr><td>${esc(T[x.assessment_id]?.title)}</td><td>${x.score}/${x.total}</td><td class="${x.passed?'ok':'bad'}">${x.passed?'Pass':'Fail'}</td><td>${T[x.assessment_id]?.kind==='exam'?`<button class="g" data-a="rt" data-id="${x.id}" data-u="${id}">Allow retake</button>`:''}</td></tr>`).join('')}</table>`:'<span class="mu">No attempts yet.</span>'}</div></div>
 <div class="card"><h3>Labs</h3><div class="sc"><table>${L.map(l=>{const p=ps.find(x=>x.lab_id===l.id),k=p?.status||'';return `<tr><td>${esc(l.title)}</td><td class="${k==='pass'?'ok':k==='redo'?'bad':''}">${k?ST[k]:'Not started'}</td></tr>`}).join('')}</table></div></div>`}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const d=b.dataset,a=d.a;
 if(a==='m-in'||a==='m-up'){mode=a.slice(2);authV()}else if(a==='go')go();else if(a==='out'){await sb.auth.signOut();me=null;mode='in';authV()}
 else if(a==='home')home();else if(a==='list')list(d.k);else if(a==='take')take(d.id);else if(a==='sub')sub(d.id,d.k);else if(a==='ctl')ctl();else if(a==='stu')stu();else if(a==='pv')take(d.id,true);
 else if(a==='labs')labs();else if(a==='lab')lab(d.id);else if(a==='lpv')lab(d.id,true);else if(a==='tick')save(false);else if(a==='lsub'){if(confirm('Submit this lab for review? You cannot edit it until your instructor replies.'))save(true)}else if(a==='rm'){rmf(+d.i)}else if(a==='rvq')rvq();else if(a==='sprof')prof(d.id);else if(a==='att'){await sb.from('attendance').upsert({user_id:d.u,session:+d.s,present:d.p!=='true'});prof(d.u)}else if(a==='rev'){const c=prompt(d.v==='pass'?'Comment (optional)':'What must be redone?')??null;if(c===null)return;await sb.from('lab_progress').update({status:d.v,comment:c}).eq('user_id',d.u).eq('lab_id',d.l);rvq()}
 else if(a==='tg'){await sb.from(d.t||'assessments').update({is_open:d.o!=='true'}).eq('id',d.id);ctl()}
 else if(a==='rt'&&confirm('Delete this exam attempt so the student can retake it?')){await sb.from('attempts').delete().eq('id',d.id);prof(d.u)}});
window.addEventListener('error',e=>{A.innerHTML='<div class="card"><b>Something went wrong</b><div class="err">'+esc(e.message)+'</div></div>'});
boot().catch(e=>{A.innerHTML='<div class="card"><b>Could not start</b><div class="err">'+esc(e.message)+'</div></div>'});
</script></body></html>
