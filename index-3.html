<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>De’Saints Security Academy Portal</title>
<style>
:root{--bg:#f3f5f9;--sf:#fff;--ink:#0b1f45;--mu:#55627a;--ln:#d5dbe6;--ac:#0b1f45;--ai:#fff;--gd:#f5b800;--ok:#17703d;--bad:#b3261e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a1226;--sf:#121c36;--ink:#e8edf8;--mu:#9aa8c4;--ln:#26345a;--ac:#f5b800;--ai:#0b1f45;--ok:#6fd49a;--bad:#ff8f86;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0a1226;--sf:#121c36;--ink:#e8edf8;--mu:#9aa8c4;--ln:#26345a;--ac:#f5b800;--ai:#0b1f45;--ok:#6fd49a;--bad:#ff8f86;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.w{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}h1,h2,h3{margin:0;line-height:1.2}h1{font-size:24px}h2{font-size:19px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:3px solid var(--gd);padding-bottom:10px}.mu{color:var(--mu);font-size:14px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
button,input,select{font:inherit;color:inherit}input,select{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--ln);border-radius:8px;background:var(--sf)}
button{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--ac);background:var(--ac);color:var(--ai);font-weight:600;cursor:pointer}button.g{background:transparent;color:var(--ink);border-color:var(--ln)}button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--gd);outline-offset:2px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
label.o{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--ln);border-radius:8px;cursor:pointer}label.o input{width:20px;min-height:20px;margin-top:2px}
.err{color:var(--bad);font-size:14px;min-height:20px}.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}.tabs{display:flex;gap:8px}.tabs button{flex:1}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}.sc{overflow-x:auto}
</style></head><body><div class="w" id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const sb=supabase.createClient('https://ekkampezeesiubkcoihu.supabase.co','sb_publishable_bY3YBy1OW21PkbRsnFzpZQ_gveYstxa');
const A=document.getElementById('app'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CO={beginner:'Beginner cohort',intermediate:'Intermediate cohort'};let me=null,mode='in';
const hd=t=>`<div class="top"><div><h1>${t}</h1><div class="mu">${esc(me.full_name)} · ${me.role==='instructor'?'Instructor':CO[me.cohort]}</div></div><button class="g" data-a="out">Log out</button></div>`;
const back=(a='home')=>`<div><button class="g" data-a="${a}">← Back</button></div>`;
async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session)return authV();
 const{data}=await sb.from('profiles').select('*').eq('id',session.user.id).single();me=data;home()}
function authV(msg=''){A.innerHTML=`<div class="top"><div><h1>De’Saints Security Academy</h1><div class="mu">Student and instructor portal</div></div></div>
<div class="card"><div class="tabs"><button class="${mode==='in'?'':'g'}" data-a="m-in">Log in</button><button class="${mode==='up'?'':'g'}" data-a="m-up">Create account</button></div>
${mode==='up'?'<input id="nm" placeholder="Full name (as it should appear on your certificate)" autocomplete="name"><select id="co"><option value="intermediate">Intermediate cohort</option><option value="beginner">Beginner cohort</option></select>':''}
<input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Password (8+ characters)" autocomplete="${mode==='in'?'current-password':'new-password'}">
<div class="err" id="er">${esc(msg)}</div><button data-a="go">${mode==='in'?'Log in':'Create account'}</button></div>`}
async function go(){const v=i=>document.getElementById(i)?.value.trim(),em=v('em'),pw=document.getElementById('pw').value;
 if(!em||pw.length<8)return authV('Enter your email and a password of at least 8 characters.');
 if(mode==='up'){if(!v('nm'))return authV('Enter your full name.');
  const{data,error}=await sb.auth.signUp({email:em,password:pw,options:{data:{full_name:v('nm'),cohort:v('co')}}});
  if(error)return authV(error.message);if(!data.session){mode='in';return authV('Account created. Check your email to confirm it, then log in.')}}
 else{const{error}=await sb.auth.signInWithPassword({email:em,password:pw});if(error)return authV(error.message)}
 boot()}
function home(){if(me.role==='instructor')return A.innerHTML=hd('Instructor home')+`<div class="grid">
<div class="card"><h2>Quizzes and exams</h2><p class="mu">Switch each one on when you have taught the topic. Preview what students see.</p><button data-a="ctl">Open</button></div>
<div class="card"><h2>Students</h2><p class="mu">Scores for every student. Allow an exam retake.</p><button data-a="stu">Open</button></div>
<div class="card"><h2>Labs · Assignments · Attendance · Certificates</h2><p class="mu">Coming in the next parts.</p><button disabled>Soon</button></div></div>`;
 A.innerHTML=hd('Welcome, '+esc(me.full_name.split(' ')[0]))+`<div class="grid">
<div class="card"><h2>Quizzes</h2><p class="mu">Weekly quizzes.</p><button data-a="list" data-k="quiz">Open</button></div>
<div class="card"><h2>Exams</h2><p class="mu">Final assessment. One attempt unless your instructor allows a retake.</p><button data-a="list" data-k="exam">Open</button></div>
<div class="card"><h2>Assignments</h2><p class="mu">Coming soon.</p><button disabled>Soon</button></div>
<div class="card"><h2>Labs</h2><p class="mu">Coming soon.</p><button disabled>Soon</button></div></div>`}
async function list(k){const[{data:as},{data:at}]=await Promise.all([sb.from('assessments').select('*').eq('kind',k).order('week'),sb.from('attempts').select('*').eq('user_id',(await sb.auth.getUser()).data.user.id)]);
 A.innerHTML=hd(k==='quiz'?'Quizzes':'Exams')+back()+(as.length?as.map(a=>{const m=at.filter(x=>x.assessment_id===a.id),b=m.sort((x,y)=>y.score-x.score)[0],done=k==='exam'&&m.length;
 return `<div class="card row"><div><h3>${esc(a.title)}</h3><div class="mu">${b?`Best: ${b.score}/${b.total} · <span class="${b.passed?'ok':'bad'}">${b.passed?'Passed':'Not passed'}</span>`:'Not taken yet'}</div></div>
 <button data-a="take" data-id="${a.id}" ${done?'disabled':''}>${done?'Taken':b?'Retake':'Start'}</button></div>`}).join(''):'<div class="card mu">Nothing is open yet. Your instructor will open each one after the class.</div>')}
async function take(id,pv){const[{data:a},{data:q}]=await Promise.all([sb.from('assessments').select('*').eq('id',id).single(),sb.from('questions').select('*').eq('assessment_id',id).order('pos')]);
 A.innerHTML=hd(esc(a.title))+back(pv?'ctl':'list')+(pv?'<div class="card mu">Preview: this is what students see. Submitting is switched off.</div>':'')+
 `<form id="f" class="w">${q.map(x=>`<div class="card"><h3>${x.pos}. ${esc(x.q)}</h3>${x.opts.map((o,i)=>`<label class="o"><input type="radio" name="q${x.pos}" value="${i}"><span>${'ABCD'[i]}. ${esc(o)}</span></label>`).join('')}</div>`).join('')}
 <div class="err" id="er"></div><button type="button" data-a="sub" data-id="${id}" data-k="${a.kind}" ${pv?'disabled':''}>Submit answers</button></form>`}
async function sub(id,k){const f=new FormData(document.getElementById('f')),ans={};f.forEach((v,n)=>ans[n.slice(1)]=+v);
 const n=document.querySelectorAll('#f .card').length;if(Object.keys(ans).length<n&&!confirm(`You have answered ${Object.keys(ans).length} of ${n}. Submit anyway?`))return;
 const{data,error}=await sb.rpc('submit_attempt',{p_assessment:id,p_answers:ans});if(error)return document.getElementById('er').textContent=error.message;
 A.innerHTML=hd('Result')+`<div class="card"><h2>${data.score} out of ${data.total}</h2><p class="${data.passed?'ok':'bad'}">${data.passed?'Passed. Well done.':k==='exam'?'Not passed yet. Review the weeks you missed, then ask your instructor about a retake.':'Not passed yet. Re-read the notes and retake after 24 hours.'}</p><button data-a="list" data-k="${k}">Back to ${k==='quiz'?'quizzes':'exams'}</button></div>`}
async function ctl(){const{data:as}=await sb.from('assessments').select('*').order('cohort').order('week');
 A.innerHTML=hd('Quizzes and exams')+back()+['beginner','intermediate'].map(c=>`<div class="card"><h2>${CO[c]}</h2>${as.filter(a=>a.cohort===c).map(a=>`<div class="row"><div><b>${esc(a.title)}</b><div class="mu ${a.is_open?'ok':''}">${a.is_open?'Visible to students':'Hidden'}</div></div><div class="row"><button class="g" data-a="pv" data-id="${a.id}">Preview</button><button data-a="tg" data-id="${a.id}" data-o="${a.is_open}">${a.is_open?'Hide':'Activate'}</button></div></div>`).join('')}</div>`).join('')}
async function stu(){const[{data:p},{data:t},{data:as}]=await Promise.all([sb.from('profiles').select('*').eq('role','student').order('cohort').order('full_name'),sb.from('attempts').select('*').order('taken_at'),sb.from('assessments').select('id,title,kind')]);const T=Object.fromEntries(as.map(a=>[a.id,a]));
 A.innerHTML=hd('Students')+back()+(p.length?p.map(s=>{const m=t.filter(x=>x.user_id===s.id);return `<div class="card"><h3>${esc(s.full_name)} <span class="mu">· ${CO[s.cohort]}</span></h3><div class="sc">${m.length?`<table>${m.map(x=>`<tr><td>${esc(T[x.assessment_id]?.title)}</td><td>${x.score}/${x.total}</td><td class="${x.passed?'ok':'bad'}">${x.passed?'Pass':'Fail'}</td><td>${T[x.assessment_id]?.kind==='exam'?`<button class="g" data-a="rt" data-id="${x.id}">Allow retake</button>`:''}</td></tr>`).join('')}</table>`:'<span class="mu">No attempts yet.</span>'}</div></div>`}).join(''):'<div class="card mu">No students have signed up yet.</div>')}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const d=b.dataset,a=d.a;
 if(a==='m-in'||a==='m-up'){mode=a.slice(2);authV()}else if(a==='go')go();else if(a==='out'){await sb.auth.signOut();me=null;mode='in';authV()}
 else if(a==='home')home();else if(a==='list')list(d.k);else if(a==='take')take(d.id);else if(a==='sub')sub(d.id,d.k);else if(a==='ctl')ctl();else if(a==='stu')stu();else if(a==='pv')take(d.id,true);
 else if(a==='tg'){await sb.from('assessments').update({is_open:d.o!=='true'}).eq('id',d.id);ctl()}
 else if(a==='rt'&&confirm('Delete this exam attempt so the student can retake it?')){await sb.from('attempts').delete().eq('id',d.id);stu()}});
window.addEventListener('error',e=>{A.innerHTML='<div class="card"><b>Something went wrong</b><div class="err">'+esc(e.message)+'</div></div>'});
boot().catch(e=>{A.innerHTML='<div class="card"><b>Could not start</b><div class="err">'+esc(e.message)+'</div></div>'});
</script></body></html>
